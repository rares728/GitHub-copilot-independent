services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rcca_tracker
      POSTGRES_USER: rcca_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcca_tracker -d rcca_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://rcca_tracker:${POSTGRES_PASSWORD}@db:5432/rcca_tracker
      STORAGE_DIR: /app/storage
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploaded_files:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploaded_files:
